name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/Rome

permissions:
  contents: read

jobs:
  build:
    name: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --norc --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 15s
          --health-start-period 30s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cerca segreti nei commit della pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.git,target=/repo.git,readonly" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo.git \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--diff-merges=first-parent $BASE_SHA..$HEAD_SHA" \
            --redact=100 --verbose --no-banner --no-color --ignore-gitleaks-allow /repo.git
      - name: Controlla le modifiche alla configurazione
        run: |
          git diff --check HEAD^ HEAD
          if [[ -f .github/scripts/agent_workflow.py ]]; then
            python3 -m py_compile .github/scripts/agent_workflow.py
          fi
      - name: Analizza la sicurezza del codice TypeScript
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --workdir /src \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/src \
            semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config p/owasp-top-ten --metrics=off --disable-version-check --error \
            --include '*.ts' --include '*.tsx' --include '*.mts' --include '*.cts' .
      - name: Configura Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Controlla le vulnerabilità delle dipendenze npm
        run: npm audit --package-lock-only --audit-level=high
      - name: Esegui la build Next.js
        run: bash .github/scripts/verify-project
      - name: Verifica Next.js e MongoDB
        env:
          MONGODB_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports[27017] }}/mindcompanion_ci
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:integration
      - name: Costruisci l'immagine Docker web
        run: docker build --tag mindcompanion-web:ci .

  sonarcloud:
    name: SonarCloud
    if: >-
      vars.SONAR_PROJECT_KEY != '' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Verifica la configurazione SonarCloud
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          : "${SONAR_ORGANIZATION:?Configura la variabile SONAR_ORGANIZATION}"
          : "${SONAR_TOKEN:?Configura il secret SONAR_TOKEN}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configura Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Installa le dipendenze per l'analisi TypeScript
        run: npm ci --ignore-scripts --no-audit
      - name: Analizza il progetto su SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      - name: Richiedi zero segnalazioni di sicurezza aperte
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node .github/scripts/check-sonar-security.mjs

  dependency-audit:
    name: Audit giornaliero delle dipendenze
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configura Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Controlla le vulnerabilità delle dipendenze npm
        run: npm audit --package-lock-only --audit-level=high
