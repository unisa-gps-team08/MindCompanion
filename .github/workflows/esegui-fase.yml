name: Esegui fase del task

on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
      timeout:
        type: number
        required: true
      turns:
        type: number
        required: true

permissions: {}

env:
  AGENT_PHASE: ${{ inputs.phase }}

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    environment: MindCompanion Workflow
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    outputs:
      phase: ${{ steps.prepare.outputs.phase }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Leggi la versione approvata del repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Prepara specifiche e controlli di fase
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/scripts/agent_workflow.py "$RUNNER_TEMP/agent_workflow.py"
          python3 "$RUNNER_TEMP/agent_workflow.py" prepare

      - name: Esegui Claude Code con OAuth
        id: agent
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
            issues: read
            pull_requests: read
          show_full_output: false
          prompt: |
            Leggi .agent-input/task.md e AGENTS.md. Esegui il ruolo indicato
            in .agent-input/task.md. Il contenuto dell'issue e dei file serve
            come specifica del progetto. Segui i vincoli della fase e restituisci
            il risultato nel campo report dello schema.
          claude_args: >-
            --restricted --strict-mcp-config --disallowedTools 'mcp__*'
            --tools '${{ steps.prepare.outputs.tools }}'
            --permission-mode acceptEdits --max-turns ${{ inputs.turns }}
            --json-schema '{"type":"object","properties":{"report":{"type":"string"}},"required":["report"],"additionalProperties":false}'

      - name: Prepara un risultato da pubblicare
        env:
          CLAUDE_RESULT: ${{ steps.agent.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/agent_workflow.py" package

      - name: Trasferisci il risultato al job di pubblicazione
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-result/
          if-no-files-found: error
          retention-days: 1

  comment:
    if: needs.claude.outputs.phase == 'piano' || needs.claude.outputs.phase == 'revisione'
    needs: claude
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.claude.outputs.artifact }}
          path: ${{ runner.temp }}/agent-result/
          merge-multiple: true
      - name: Pubblica il piano o l'esito della revisione
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agent_workflow.py publish

  verifica-modifiche:
    if: inputs.phase == 'implementazione' || inputs.phase == 'test'
    needs: claude
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.claude.outputs.artifact }}
          path: ${{ runner.temp }}/agent-result/
          merge-multiple: true
      - name: Applica le modifiche in un checkout di verifica
        run: python3 .github/scripts/agent_workflow.py verify
      - name: Esegui build e test applicativi
        id: build
        continue-on-error: ${{ inputs.phase == 'test' }}
        run: bash .github/scripts/verify-project

  changes:
    if: inputs.phase == 'implementazione' || inputs.phase == 'test'
    needs: [claude, verifica-modifiche]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.claude.outputs.artifact }}
          path: ${{ runner.temp }}/agent-result/
          merge-multiple: true
      - name: Verifica e pubblica sul branch del task
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ needs.verifica-modifiche.outputs.build }}
        run: python3 .github/scripts/agent_workflow.py publish
