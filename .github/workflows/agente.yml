name: Agente su richiesta

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: richiesta-claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.repository == 'unisa-gps-team08/MindCompanion' &&
      github.event.sender.type == 'User' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name != 'pull_request_review_comment' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: MindCompanion Workflow
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/heads/{0}', github.event.repository.default_branch) }}
          persist-credentials: false
      - name: Rispondi alla menzione
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allow_fork_prs: false
          show_full_output: false
          claude_args: >-
            --max-turns 20 --restricted --permission-mode acceptEdits
            --tools '${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request && 'Read,Glob,Grep' || 'Read,Glob,Grep,Edit,Write,Bash' }}'
            --disallowedTools 'Edit(/.github/**),Edit(/.claude/**),Edit(/AGENTS.md),Edit(/CLAUDE.md),Edit(/CODEOWNERS)'
            --append-system-prompt 'Leggi CLAUDE.md e AGENTS.md. Su una issue rispondi con un commento. In una PR rispondi o applica le correzioni richieste sul solo branch della PR. Per cambi a configurazione, dipendenze o modelli chiedi una decisione al revisore umano.'
