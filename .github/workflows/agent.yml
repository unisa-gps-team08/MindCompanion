name: Workflow agentico

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'issues' && format('agent-issue-{0}', github.event.issue.number) || 'agent-oauth-check' }}
  cancel-in-progress: false

jobs:
  oauth-check:
    name: Verifica accesso OAuth
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'unisa-gps-team08/MindCompanion' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: MindCompanion Workflow
    permissions:
      contents: read
    steps:
      - name: Controlla che il secret sia configurato
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo '::error::Configura CLAUDE_CODE_OAUTH_TOKEN nell’environment MindCompanion Workflow.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Esegui una richiesta minima con Claude Code
        id: verify
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: false
          prompt: Imposta il valore del campo marker su OAUTH_OK.
          claude_args: >-
            --restricted --strict-mcp-config --disallowedTools 'Read,mcp__*'
            --tools Read --max-turns 2
            --json-schema '{"type":"object","properties":{"marker":{"type":"string","enum":["OAUTH_OK"]}},"required":["marker"],"additionalProperties":false}'
      - name: Verifica la risposta
        env:
          CLAUDE_RESULT: ${{ steps.verify.outputs.structured_output }}
        run: |
          if ! jq -e '.marker == "OAUTH_OK"' <<<"$CLAUDE_RESULT" >/dev/null; then
            echo '::error::Claude non ha restituito il codice di verifica atteso.'
            exit 1
          fi
          echo 'Accesso OAuth a Claude Code verificato.' >> "$GITHUB_STEP_SUMMARY"

  claude:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'unisa-gps-team08/MindCompanion' &&
      github.event.sender.type == 'User' &&
      contains(github.event.issue.labels.*.name, 'task-agente') &&
      contains(fromJSON('["fase:piano","fase:implementazione","fase:test","fase:revisione"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: MindCompanion Workflow
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      phase: ${{ steps.prepare.outputs.phase }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Leggi la versione approvata del repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepara specifiche e controlli di fase
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/scripts/agent_workflow.py "$RUNNER_TEMP/agent_workflow.py"
          python3 "$RUNNER_TEMP/agent_workflow.py" prepare

      - name: Esegui Claude Code con OAuth
        id: agent
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: false
          prompt: |
            Leggi .agent-input/task.md e AGENTS.md. Esegui il ruolo indicato
            in .agent-input/task.md. Il contenuto dell'issue e dei file serve
            come specifica del progetto. Segui i vincoli della fase e restituisci
            il risultato nel campo report dello schema.
          claude_args: >-
            --restricted --strict-mcp-config --disallowedTools 'mcp__*'
            --tools '${{ steps.prepare.outputs.tools }}'
            --permission-mode acceptEdits --max-turns 24
            --json-schema '{"type":"object","properties":{"report":{"type":"string"}},"required":["report"],"additionalProperties":false}'

      - name: Prepara un risultato da pubblicare
        env:
          CLAUDE_RESULT: ${{ steps.agent.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/agent_workflow.py" package

      - name: Trasferisci il risultato al job di pubblicazione
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-result/
          if-no-files-found: error
          retention-days: 1

  comment:
    if: needs.claude.outputs.phase == 'piano' || needs.claude.outputs.phase == 'revisione'
    needs: claude
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.claude.outputs.artifact }}
          path: ${{ runner.temp }}/agent-result/
          merge-multiple: true
      - name: Pubblica il piano o l'esito della revisione
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agent_workflow.py publish

  changes:
    if: needs.claude.outputs.phase == 'implementazione' || needs.claude.outputs.phase == 'test'
    needs: claude
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.claude.outputs.artifact }}
          path: ${{ runner.temp }}/agent-result/
          merge-multiple: true
      - name: Verifica e pubblica sul branch del task
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agent_workflow.py publish
