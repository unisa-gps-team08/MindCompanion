name: Verifica OAuth di Claude

on:
  workflow_dispatch:

permissions: {}

jobs:
  oauth-check:
    name: Verifica accesso OAuth
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'unisa-gps-team08/MindCompanion' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: MindCompanion Workflow
    permissions:
      contents: read
    steps:
      - name: Controlla che il secret sia configurato
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo '::error::Configura CLAUDE_CODE_OAUTH_TOKEN nell’environment MindCompanion Workflow.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Esegui una richiesta minima con Claude Code
        id: verify
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: false
          prompt: Imposta il valore del campo marker su OAUTH_OK.
          claude_args: >-
            --restricted --strict-mcp-config --disallowedTools 'Read,mcp__*'
            --tools Read --max-turns 2
            --json-schema '{"type":"object","properties":{"marker":{"type":"string","enum":["OAUTH_OK"]}},"required":["marker"],"additionalProperties":false}'
      - name: Verifica la risposta
        env:
          CLAUDE_RESULT: ${{ steps.verify.outputs.structured_output }}
        run: |
          if ! jq -e '.marker == "OAUTH_OK"' <<<"$CLAUDE_RESULT" >/dev/null; then
            echo '::error::Claude non ha restituito il codice di verifica atteso.'
            exit 1
          fi
          echo 'Accesso OAuth a Claude Code verificato.' >> "$GITHUB_STEP_SUMMARY"
