name: Agente tester

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.repository == 'unisa-gps-team08/MindCompanion' &&
      github.event.sender.type == 'User' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.label.name == 'fase:test' &&
      github.event.pull_request.draft &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/esegui-fase.yml
    with:
      phase: test
      timeout: 30
      turns: 30
